    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhYWQ4OWMzYS00MjA4LTQwMjMtODAzNy03OTBmNmU0YTExYzYiLCJpZCI6NzU1Miwic2NvcGVzIjpbImFzciIsImdjIl0sImlhdCI6MTU0OTc2NjgwNn0.IznlFpdNxINwCo9A6W4lxynEEVXfOx4i4MHA7CaHshI';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrain: Cesium.Terrain.fromWorldTerrain(),
            shouldAnimate: true,
            timeline: false,
            animation: false,
        });

        let tileset = null;

        async function loadModel(assetId) {
            if (tileset) {
                viewer.scene.primitives.remove(tileset);
                tileset = null;  // Clear the reference
            }
            try {
                tileset = await Cesium.Cesium3DTileset.fromIonAssetId(assetId);
                viewer.scene.primitives.add(tileset);
                viewer.zoomTo(tileset);

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(112.63402360393479,-7.919075322302064, 600),
                    orientation: {
                        heading: Cesium.Math.toRadians(0.0),
                        pitch: Cesium.Math.toRadians(-15.0),
                    }
                });

                console.log(`Model ${assetId} loaded successfully.`);
            } catch (error) {
                console.error(`Error loading tileset (ID: ${assetId}): ${error}`);
            }
        }

        document.getElementById('loadModel1').addEventListener('click', function() {
            loadModel(2748972);
        });

        document.getElementById('loadModel2').addEventListener('click', function() {
            loadModel(2747379);
        });

        // Tambahkan GeoJSON sebagai entitas
        Cesium.GeoJsonDataSource.load('data/ITN.geojson', {
            stroke: Cesium.Color.YELLOW.withAlpha(0.5),
            fill: Cesium.Color.CYAN.withAlpha(0.3),
            clampToGround: true
        }).then(function(dataSource) {
            viewer.dataSources.add(dataSource);
            viewer.zoomTo(dataSource);
        
            const entities = dataSource.entities.values;
        
            for (let i = 0; i < entities.length; i++) {
                const entity = entities[i];
        
                // Set default styling
                entity.polygon.material = Cesium.Color.CYAN.withAlpha(0.3);
                entity.polygon.outline = true;
                entity.polygon.outlineColor = Cesium.Color.YELLOW;
        
                // Tambahkan properti interaksi
                entity.description = new Cesium.CallbackProperty(() => {
                    const name = entity.name || "Unnamed";
                    const area = getPolygonArea(entity.polygon.hierarchy.getValue(Cesium.JulianDate.now()).positions);
                    const centroid = getCentroid(entity.polygon.hierarchy.getValue(Cesium.JulianDate.now()).positions);
                    return `
                        <strong>Nama:</strong> ${name}<br>
                        <strong>Luas:</strong> ${area.toFixed(2)} m²<br>
                        <strong>Posisi:</strong> Lat: ${centroid.lat.toFixed(6)}, Lon: ${centroid.lon.toFixed(6)}
                    `;
                }, false);
            }
        
            // Highlight on click
            const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            handler.setInputAction(function (movement) {
                const pickedObject = viewer.scene.pick(movement.position);
                if (Cesium.defined(pickedObject) && pickedObject.id && pickedObject.id.polygon) {
                    entities.forEach(e => {
                        e.polygon.material = Cesium.Color.CYAN.withAlpha(0.04);
                    });
                    pickedObject.id.polygon.material = Cesium.Color.BLUE.withAlpha(0.6);
                }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
        });

        function getPolygonArea(positions) {
            const cartographics = positions.map(p => Cesium.Cartographic.fromCartesian(p));
            const radiansToDegrees = Cesium.Math.toDegrees;
        
            let area = 0;
            for (let i = 0; i < cartographics.length - 1; i++) {
                const xi = radiansToDegrees(cartographics[i].longitude);
                const yi = radiansToDegrees(cartographics[i].latitude);
                const xi1 = radiansToDegrees(cartographics[i + 1].longitude);
                const yi1 = radiansToDegrees(cartographics[i + 1].latitude);
                area += (xi * yi1 - xi1 * yi);
            }
            return Math.abs(area / 2 * 111139 * 111139); // approx. to square meters
        }
        
        function getCentroid(positions) {
            let x = 0, y = 0, z = 0;
            for (const pos of positions) {
                x += pos.x;
                y += pos.y;
                z += pos.z;
            }
            const len = positions.length;
            const centroid = new Cesium.Cartesian3(x / len, y / len, z / len);
            const cartographic = Cesium.Cartographic.fromCartesian(centroid);
            return {
                lat: Cesium.Math.toDegrees(cartographic.latitude),
                lon: Cesium.Math.toDegrees(cartographic.longitude)
            };
        }

    </script>
